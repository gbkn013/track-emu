[project]
name = "tn-rail-tracker"
version = "0.0.0"
description = "TN Rail Tracker — live EMU/MEMU PWA for Tamil Nadu (Chennai Suburban first)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701"]  # line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"backend/app/api/main.py" = ["B008"]  # FastAPI Query() defaults

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "tests"]
